# Paper experiments for SCRAPL. This is a standalone uv project with its own lockfile
# and venv, so its pins (e.g. torch==2.8.0, msclap's numpy<2) never constrain the
# scrapl-loss library dependencies in the root pyproject.toml.
[project]
name = "scrapl-experiments"
version = "0.1.0"
description = "Paper experiments for SCRAPL"
requires-python = ">=3.13"
dependencies = [
    "scrapl-loss[torch]",
    "auraloss>=0.4.0",
    "black>=26.5.1",
    "einops>=0.8.2",
    "hypy-utils>=1.0.29",
    "jsonargparse[signatures]>=4.52.0",
    "librosa>=0.10.2.post1",
    "lightning>=2.6.6",
    "matplotlib>=3.10.9",
    "msclap>=1.3.4",
    "nnaudio>=0.3.4",
    "nvitop>=1.7.1",
    "pandas>=2.3.3",
    "pyloudnorm>=0.2.0",
    "tensorboard>=2.21.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec>=0.17.0",
    "torchvision>=0.23.0",
    "wandb>=0.30.0",
]

[tool.uv]
# Experiments are run, not built or published.
package = false
python-preference = "only-managed"

# Use the scrapl-loss library from the repo root, in editable mode.
[tool.uv.sources]
scrapl-loss = { path = "..", editable = true }
