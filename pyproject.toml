[project]
name = "scrapl-loss"
version = "0.1.0"
description = "SCRAPL: Scattering Transform with Random Paths for Machine Learning"
readme = "scrapl/README.md"
requires-python = ">=3.13"
authors = [
    {name = "Christopher Mitcheltree", email = "christhetree@gmail.com"},
    {name = "Vincent Lostanlen", email = "vincent.lostanlen@ls2n.fr"},
]
license = { text = "MIT" }
keywords = [
    "scattering transform",
    "wavelets",
    "stochastic optimization",
    "ddsp",
    "perceptual quality assessment",
    "machine learning",
    "pytorch",
    "jtfs",
]

 dependencies = [
      "numpy>=2.1.0",
      "scipy>=1.14.1",
]

[project.optional-dependencies]
torch = [
    "torch>=2.6.0",
]
jax = [
    "equinox>=0.11.5",
    "jax>=0.5.0",
    "jaxtyping>=0.2.20",
    "optax>=0.2.5",
    "tqdm>=4.66.0",
]
test = [
    "black>=26.10.1",
    "pytest>=8.0.0",
    "tqdm>=4.66.0",
]

[project.urls]
Website = "https://christhetree.github.io/scrapl/"
Repository = "https://github.com/christhetree/scrapl/"
"ICLR 2026 Paper" = "https://openreview.net/forum?id=RuYwbd5xYa"

# Misc. ================================================================================
[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

# Required since the scrapl package is not located in a src subdirectory.
[tool.uv.build-backend]
module-name = "scrapl"
module-root = "."

[tool.uv]
# Only use uv-managed Python installs, never system ones. The lockfile's supported
# Python range comes from `requires-python`; the dev interpreter from `.python-version`.
python-preference = "only-managed"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v -s"  # verbose output
# Show log records live in the same format as logging.basicConfig()
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s:%(name)s:%(message)s"
